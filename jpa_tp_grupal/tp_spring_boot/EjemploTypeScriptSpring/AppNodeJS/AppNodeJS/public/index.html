<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facturas de Venta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .api-log-panel {
            margin-top: 2rem;
            border: 1px solid #dee2e6;
            border-radius: 0.375rem;
            background-color: #f8f9fa;
        }
        .api-log-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem 1rem;
            background-color: #e9ecef;
            border-bottom: 1px solid #dee2e6;
            border-radius: 0.375rem 0.375rem 0 0;
        }
        .api-log-entradas {
            padding: 1rem;
            max-height: 400px;
            overflow-y: auto;
        }
        .api-log-entrada {
            background-color: #ffffff;
            border: 1px solid #dee2e6;
            border-radius: 0.25rem;
            padding: 0.75rem;
            margin-bottom: 0.75rem;
            font-family: SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
            font-size: 0.875rem;
        }
        .api-log-entrada:last-child {
            margin-bottom: 0;
        }
        .api-log-linea-principal {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-bottom: 0.5rem;
        }
        .api-log-timestamp {
            color: #6c757d;
            font-size: 0.75rem;
        }
        .api-log-metodo {
            font-weight: 700;
            padding: 0.15rem 0.4rem;
            border-radius: 0.2rem;
            font-size: 0.75rem;
        }
        .api-log-metodo-get { background-color: #d1e7dd; color: #0f5132; }
        .api-log-metodo-post { background-color: #cfe2ff; color: #084298; }
        .api-log-metodo-put { background-color: #fff3cd; color: #664d03; }
        .api-log-metodo-delete { background-color: #f8d7da; color: #842029; }
        .api-log-url {
            color: #212529;
            word-break: break-all;
        }
        .api-log-seccion {
            color: #6c757d;
            font-size: 0.75rem;
            margin-top: 0.5rem;
            margin-bottom: 0.25rem;
            text-transform: uppercase;
            letter-spacing: 0.025em;
        }
        .api-log-headers,
        .api-log-body {
            margin: 0;
            padding: 0.5rem;
            background-color: #212529;
            color: #d4d4d4;
            border-radius: 0.25rem;
            overflow-x: auto;
            white-space: pre-wrap;
            word-break: break-word;
        }
    </style>
</head>
<body class="bg-light">
    <div class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>Facturas de Venta</h1>
            <a href="/factura-form.html" class="btn btn-primary">Nueva Factura</a>
        </div>

        <div class="card mb-4">
            <div class="card-body">
                <h5 class="card-title">Filtros</h5>
                <form id="filtros-form" class="row g-3">
                    <div class="col-md-3">
                        <label for="filtro-numero" class="form-label">Número de Factura</label>
                        <input type="number" class="form-control" id="filtro-numero" placeholder="Ej: 1001">
                    </div>
                    <div class="col-md-3">
                        <label for="filtro-cliente" class="form-label">Cliente</label>
                        <input type="text" class="form-control" id="filtro-cliente" placeholder="Nombre del cliente">
                    </div>
                    <div class="col-md-3">
                        <label for="filtro-condicion" class="form-label">Condición IVA</label>
                        <input type="text" class="form-control" id="filtro-condicion" placeholder="Ej: Monotributo">
                    </div>
                    <div class="col-md-3">
                        <label for="filtro-fecha-desde" class="form-label">Fecha Desde</label>
                        <input type="date" class="form-control" id="filtro-fecha-desde">
                    </div>
                    <div class="col-md-3">
                        <label for="filtro-fecha-hasta" class="form-label">Fecha Hasta</label>
                        <input type="date" class="form-control" id="filtro-fecha-hasta">
                    </div>
                    <div class="col-12">
                        <button type="submit" class="btn btn-outline-primary">Buscar</button>
                        <button type="button" id="btn-limpiar" class="btn btn-outline-secondary">Limpiar</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="card">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped table-hover">
                        <thead class="table-dark">
                            <tr>
                                <th>Número</th>
                                <th>Fecha</th>
                                <th>Cliente</th>
                                <th>Condición IVA</th>
                                <th>Punto de Venta</th>
                                <th class="text-end">Importe Total</th>
                                <th class="text-center">Items</th>
                                <th class="text-center">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="facturas-tbody">
                            <tr>
                                <td colspan="8" class="text-center">Cargando...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="/dist/facturas.js"></script>
</body>
</html>
