<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Factura de Venta - Formulario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .api-log-panel {
            margin-top: 2rem;
            border: 1px solid #dee2e6;
            border-radius: 0.375rem;
            background-color: #f8f9fa;
        }
        .api-log-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem 1rem;
            background-color: #e9ecef;
            border-bottom: 1px solid #dee2e6;
            border-radius: 0.375rem 0.375rem 0 0;
        }
        .api-log-entradas {
            padding: 1rem;
            max-height: 400px;
            overflow-y: auto;
        }
        .api-log-entrada {
            background-color: #ffffff;
            border: 1px solid #dee2e6;
            border-radius: 0.25rem;
            padding: 0.75rem;
            margin-bottom: 0.75rem;
            font-family: SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
            font-size: 0.875rem;
        }
        .api-log-entrada:last-child {
            margin-bottom: 0;
        }
        .api-log-linea-principal {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-bottom: 0.5rem;
        }
        .api-log-timestamp {
            color: #6c757d;
            font-size: 0.75rem;
        }
        .api-log-metodo {
            font-weight: 700;
            padding: 0.15rem 0.4rem;
            border-radius: 0.2rem;
            font-size: 0.75rem;
        }
        .api-log-metodo-get { background-color: #d1e7dd; color: #0f5132; }
        .api-log-metodo-post { background-color: #cfe2ff; color: #084298; }
        .api-log-metodo-put { background-color: #fff3cd; color: #664d03; }
        .api-log-metodo-delete { background-color: #f8d7da; color: #842029; }
        .api-log-url {
            color: #212529;
            word-break: break-all;
        }
        .api-log-seccion {
            color: #6c757d;
            font-size: 0.75rem;
            margin-top: 0.5rem;
            margin-bottom: 0.25rem;
            text-transform: uppercase;
            letter-spacing: 0.025em;
        }
        .api-log-headers,
        .api-log-body {
            margin: 0;
            padding: 0.5rem;
            background-color: #212529;
            color: #d4d4d4;
            border-radius: 0.25rem;
            overflow-x: auto;
            white-space: pre-wrap;
            word-break: break-word;
        }
    </style>
</head>
<body class="bg-light">
    <div class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 id="titulo">Nueva Factura de Venta</h1>
            <a href="/index.html" class="btn btn-outline-secondary">Volver al listado</a>
        </div>

        <form id="factura-form">
            <div class="card mb-4">
                <div class="card-body">
                    <h5 class="card-title">Datos de la Factura</h5>
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label for="numero-factura" class="form-label">Número de Factura</label>
                            <input type="number" class="form-control" id="numero-factura" readonly>
                            <div class="form-text">Se asigna automáticamente al crear.</div>
                        </div>
                        <div class="col-md-4">
                            <label for="fecha-emision" class="form-label">Fecha de Emisión</label>
                            <input type="date" class="form-control" id="fecha-emision" required>
                        </div>
                        <div class="col-md-4">
                            <label for="punto-venta" class="form-label">Punto de Venta</label>
                            <input type="text" class="form-control" id="punto-venta" required>
                        </div>
                        <div class="col-md-6">
                            <label for="cliente" class="form-label">Cliente</label>
                            <input type="text" class="form-control" id="cliente" required>
                        </div>
                        <div class="col-md-6">
                            <label for="condicion-iva" class="form-label">Condición IVA</label>
                            <input type="text" class="form-control" id="condicion-iva" required>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card mb-4">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h5 class="card-title mb-0">Detalles</h5>
                        <button type="button" id="btn-agregar-detalle" class="btn btn-success btn-sm">+ Agregar ítem</button>
                    </div>
                    <div class="table-responsive">
                        <table class="table">
                            <thead class="table-light">
                                <tr>
                                    <th>Producto</th>
                                    <th style="width: 140px;">Cantidad</th>
                                    <th style="width: 160px;">Precio Unitario</th>
                                    <th style="width: 140px;">Subtotal</th>
                                    <th style="width: 100px;"></th>
                                </tr>
                            </thead>
                            <tbody id="detalles-tbody">
                            </tbody>
                            <tfoot>
                                <tr>
                                    <td colspan="3" class="text-end fw-bold">Importe Total:</td>
                                    <td class="fw-bold" id="importe-total">0.00</td>
                                    <td></td>
                                </tr>
                            </tfoot>
                        </table>
                    </div>
                </div>
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">Guardar</button>
                <a href="/index.html" class="btn btn-outline-secondary">Cancelar</a>
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="/dist/factura-form.js"></script>
</body>
</html>
