plugins {
	id 'java'
	// CONSIGNA - PARTE 3.1: Spring Boot version 3.x o superior.
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
	sourceCompatibility = '17'
	targetCompatibility = '17'
}

repositories {
	mavenCentral()
}

dependencies {
	// CONSIGNA - PARTE 3.1: Spring Data JPA y Spring Web.
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.bouncycastle:bcpkix-jdk18on:1.86'

	// CONSIGNA - PARTE 2: librerias elegidas para generar PDF y Excel XLSX.
	implementation 'com.github.librepdf:openpdf:1.3.43'
	implementation 'com.google.zxing:core:3.5.3'
	implementation 'com.github.jknack:handlebars:4.5.8'
	implementation 'com.openhtmltopdf:openhtmltopdf-pdfbox:1.0.10'
	implementation 'com.openhtmltopdf:openhtmltopdf-svg-support:1.0.10'
	implementation 'org.apache.poi:poi-ooxml:5.3.0'

	// CONSIGNA - PARTE 1.1 y PARTE 3.1: Lombok y su procesador de anotaciones.
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	// CONSIGNA - PARTE 3.1: driver SQL. Se usa el driver oficial de MariaDB
	// porque esta adaptacion debe funcionar especificamente con MariaDB.
	runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'
}

tasks.withType(JavaCompile).configureEach {
	options.release = 17
}

processResources {
	from('src/img') {
		include 'logo_afip.png'
		into 'static/invoice'
	}
	from('storemanager/frontend/src/assets') {
		include 'react.svg'
		into 'static/invoice'
	}
}
