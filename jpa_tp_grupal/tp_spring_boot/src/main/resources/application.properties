spring.application.name=tp-spring-boot-facturacion

# MariaDB. Estos valores pueden reemplazarse con variables de entorno.
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/tp_spring_boot}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Usa la zona horaria local al serializar fechas. FacturaReporteDTO define
# su propio formato para incluir fecha y hora.
spring.jackson.time-zone=America/Argentina/Buenos_Aires
spring.jackson.date-format=yyyy-MM-dd

# ARCA / WSFEv1 - exclusivamente homologacion. Los secretos quedan fuera del repositorio.
arca.homologacion.cuit=${ARCA_CUIT:}
arca.homologacion.condicion-iva-emisor=${ARCA_CONDICION_IVA_EMISOR:MONOTRIBUTO}
arca.homologacion.razon-social-emisor=${ARCA_RAZON_SOCIAL_EMISOR:Test Facturas}
arca.homologacion.ingresos-brutos-emisor=${ARCA_INGRESOS_BRUTOS_EMISOR:No contribuyente (TEST)}
arca.homologacion.telefono-emisor=${ARCA_TELEFONO_EMISOR:2615000000}
arca.homologacion.logo-path=${ARCA_LOGO_PATH:}
arca.homologacion.keystore-path=${ARCA_KEYSTORE_PATH:}
arca.homologacion.keystore-password=${ARCA_KEYSTORE_PASSWORD:}
arca.homologacion.wsaa-url=https://wsaahomo.afip.gov.ar/ws/services/LoginCms
arca.homologacion.wsfe-url=https://wswhomo.afip.gov.ar/wsfev1/service.asmx
arca.homologacion.connect-timeout-seconds=10
arca.homologacion.read-timeout-seconds=30
